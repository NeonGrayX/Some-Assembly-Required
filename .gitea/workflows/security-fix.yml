# .gitea/workflows/security-fix.yml - copy into every app repo Patchboard should fix.
#
# Started by Patchboard (or by hand: Actions -> Security fix -> Run workflow), never by a
# push. It starts from the newest release tag, not from main, so a fix never ships
# commits that were not released yet:
#
#   audit-fix  npm audit fix in every package-lock.json (lockfile only, never --force),
#              then npm ci in every directory with a lockfile, and the tests and the
#              build where a lockfile changed. Only if all pass: tag the next version.
#              No change -> no tag, and Patchboard says so.
#   rebuild    tag the next version on the same commit, so the Deploy workflow builds
#              the image again with --pull: fresh base image, its OS fixes included.
#
# The new tag is deployed by the repo's own deploy.yml (docs: Part 5).
#
# The fix commit also goes to the branch the workflow was started on (main), but only
# when main has nothing unreleased on top of the base tag, so it can fast-forward.
# Otherwise (or when main refuses the push) it is pushed as security-fix/<tag> to be
# merged by hand. Branch and tag go in one atomic push: both arrive or neither, so a
# run never leaves a branch with an untagged fix, nor a tag whose commit is on no branch.
#
# Who pushes. Gitea checks a protected tag (`v*`) against the users and teams on its
# allow-list, and the Actions job token (user `gitea-actions`) can never be on it.
#   - Secret RELEASE_TOKEN set (an account-level secret, so every app repo has it): the
#     push is made as Patchboard's bot - a token of the bot with scope
#     `write:repository` and nothing else, the bot on the allow-list of `v*` (and of
#     main, if the fix should fast-forward it). Its push starts the repo's workflows like
#     any user's: deploy.yml starts for the tag (Patchboard finds that run and does not
#     dispatch a second one). Use this when `v*` is protected.
#   - Not set: the job token. Its push starts no workflow, so Patchboard dispatches
#     deploy.yml. It fails (nothing pushed) once `v*` is protected: create the token and
#     the secret first, then protect the tag.
#
# Two jobs, so the code under test never shares a job with a token that can push:
#
#   fix      (read-only token) resolves the fix, installs it, runs the tests and the
#            build. The lockfile change and its hash are set as outputs in the step that
#            resolves it, before any package code runs.
#   release  (token that can push, used only in the last step) checks out the base tag
#            afresh, applies exactly that lockfile change (lockfiles only), then commits,
#            tags and pushes. Nothing in it runs package code or a tool from the runner's
#            tool cache: an install script in `fix` could otherwise leave a git hook, a
#            git config or a `git` of its own for the step that holds the token.
#
# Neither job keeps a git credential (persist-credentials: false).
name: Security fix

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit-fix (npm audit fix, then release) or rebuild (release the same code with a fresh image)'
        required: true
        default: audit-fix
        type: choice
        options:
          - audit-fix
          - rebuild
      base:
        description: 'Release tag to start from; empty = the newest vX.Y.Z'
        required: false
        default: ''

permissions: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.base }}
      next: ${{ steps.base.outputs.next }}
      changed: ${{ steps.audit.outputs.changed }}
      fix: ${{ steps.audit.outputs.fix }}
      fix_hash: ${{ steps.audit.outputs.fix_hash }}

    steps:
      # fetch-depth 0 brings every tag and branch, so no later step needs a credential.
      - name: Check out every tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Inputs reach the scripts as environment variables only, and are checked before
      # use, so nothing typed into the dispatch form can become shell code.
      - name: Find the base release
        id: base
        env:
          MODE: ${{ inputs.mode }}
          BASE: ${{ inputs.base }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          case "$MODE" in audit-fix|rebuild) ;; *) echo "unknown mode: $MODE" >&2; exit 1 ;; esac
          if [ -z "$BASE" ]; then
            BASE="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          fi
          if ! printf '%s' "$BASE" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "No usable base tag (got '${BASE}'). Release once with ./deploy.sh first." >&2
            exit 1
          fi
          git rev-parse --quiet --verify "refs/tags/${BASE}" >/dev/null || { echo "tag ${BASE} does not exist" >&2; exit 1; }
          # The next version, counting each part to 9 and carrying, as deploy.sh does.
          latest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          v="${latest#v}"; major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          patch=$((patch + 1))
          if [ "$patch" -gt 9 ]; then patch=0; minor=$((minor + 1)); fi
          if [ "$minor" -gt 9 ]; then minor=0; major=$((major + 1)); fi
          NEXT="v${major}.${minor}.${patch}"
          git checkout --quiet --detach "refs/tags/${BASE}"
          git config user.name "Patchboard"
          git config user.email "patchboard@noreply.invalid"
          {
            echo "MODE=${MODE}"
            echo "BASE=${BASE}"
            echo "NEXT=${NEXT}"
            echo "BRANCH=${BRANCH}"
          } >> "$GITHUB_ENV"
          {
            echo "base=${BASE}"
            echo "next=${NEXT}"
          } >> "$GITHUB_OUTPUT"
          echo "Base ${BASE}, next ${NEXT}, mode ${MODE}"

      - name: Set up Node
        if: inputs.mode == 'audit-fix'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # --package-lock-only: the lockfile is changed without running any install script.
      # Scripts run only in the npm ci below, exactly as in a normal build. The change is
      # committed here (not pushed), so the next step can put back a lockfile that an
      # install script rewrote, and tests what is committed. The change itself (gzip,
      # base64) and its hash are this step's outputs: the release job commits exactly
      # that, as resolved here before any package code ran.
      - name: npm audit fix
        id: audit
        if: inputs.mode == 'audit-fix'
        run: |
          set -eu
          locks="$(git ls-files '*package-lock.json' | grep -v '/node_modules/' || true)"
          if [ -z "$locks" ]; then
            echo "No package-lock.json in this repo: nothing for npm audit fix to do."
            echo "CHANGED=no" >> "$GITHUB_ENV"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for lock in $locks; do
            dir="$(dirname "$lock")"
            echo "::group::${dir}: npm audit (before)"
            (cd "$dir" && npm audit || true)
            echo "::endgroup::"
            (cd "$dir" && npm audit fix --package-lock-only --ignore-scripts || true)
          done
          if git diff --quiet; then
            echo "npm audit fix changed nothing - what is left needs a major upgrade by hand."
            echo "CHANGED=no" >> "$GITHUB_ENV"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            git diff --stat
            fix="${RUNNER_TEMP:-/tmp}/fix.diff"
            git diff --binary > "$fix"
            encoded="$(gzip -9 -n -c "$fix" | base64 -w0)"
            # A job output must stay well below 1 MB.
            if [ "${#encoded}" -gt 900000 ]; then
              echo "The lockfile change is too large to hand to the release job (${#encoded} bytes encoded). Apply it by hand." >&2
              exit 1
            fi
            {
              echo "fix_hash=$(sha256sum < "$fix" | cut -c1-64)"
              echo "fix=${encoded}"
            } >> "$GITHUB_OUTPUT"
            git commit --quiet -a -m "Security: npm audit fix on ${BASE}" -m "Started from Patchboard."
            echo "CHANGED=yes" >> "$GITHUB_ENV"
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      # Every directory with a lockfile is installed, not only the changed ones: a test
      # may import code and packages from another one (a backend spec using
      # frontend/node_modules). The root first, then deeper ones: before each npm ci its
      # lockfile is put back as committed, which undoes a root postinstall that ran
      # `npm install` in a subdirectory.
      - name: Install, test and build what changed
        if: inputs.mode == 'audit-fix' && env.CHANGED == 'yes'
        run: |
          set -eu
          locks="$(git ls-files '*package-lock.json' | grep -v '/node_modules/' | awk -F/ '{ print NF "\t" $0 }' | sort -n | cut -f2-)"
          for lock in $locks; do
            dir="$(dirname "$lock")"
            echo "::group::${dir}: npm ci"
            git checkout --quiet HEAD -- "$lock"
            (cd "$GITHUB_WORKSPACE/$dir" && npm ci --no-audit --no-fund)
            echo "::endgroup::"
          done
          if ! git diff --quiet HEAD -- $locks; then
            git diff --stat HEAD -- $locks
            echo "Installing changed a lockfile, so the tests would not test what is committed." >&2
            exit 1
          fi
          for lock in $(git diff --name-only HEAD^ HEAD | grep 'package-lock.json$'); do
            dir="$(dirname "$lock")"
            echo "::group::${dir}: test and build"
            cd "$GITHUB_WORKSPACE/$dir"
            # The runner image has no browsers. Tests that run in one (Vitest browser
            # mode, Playwright) get the Chromium of the Playwright version in the lockfile.
            if [ -x node_modules/.bin/playwright ]; then
              npx --no-install playwright install --with-deps chromium
            fi
            npm test --if-present
            npm run build --if-present
            echo "--- remaining (runtime dependencies) ---"
            npm audit --omit=dev || true
            echo "::endgroup::"
          done

  release:
    needs: fix
    if: inputs.mode == 'rebuild' || needs.fix.outputs.changed == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out every tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # On a clean checkout of the base: the lockfile change exactly as `fix` resolved and
      # tested it, never the workspace the tests ran in.
      - name: Apply the tested fix
        env:
          MODE: ${{ inputs.mode }}
          BASE: ${{ needs.fix.outputs.base }}
          FIX: ${{ needs.fix.outputs.fix }}
          FIX_HASH: ${{ needs.fix.outputs.fix_hash }}
        run: |
          set -eu
          git checkout --quiet --detach "refs/tags/${BASE}"
          [ "$MODE" = audit-fix ] || exit 0
          fix="${RUNNER_TEMP:-/tmp}/fix.diff"
          printf '%s' "$FIX" | base64 -d | gunzip -c > "$fix"
          if [ "$(sha256sum < "$fix" | cut -c1-64)" != "$FIX_HASH" ]; then
            echo "The lockfile change did not arrive as the fix job tested it." >&2
            exit 1
          fi
          git -c core.hooksPath=/dev/null apply --index "$fix"
          if git diff --cached --name-only | grep -vqE '(^|/)package-lock\.json$'; then
            git diff --cached --stat
            echo "npm audit fix changed more than lockfiles." >&2
            exit 1
          fi
          git -c core.hooksPath=/dev/null -c user.name=Patchboard -c user.email=patchboard@noreply.invalid \
            commit --quiet -m "Security: npm audit fix on ${BASE}" -m "Started from Patchboard."

      # The only step with a credential, used as an HTTP header of these git commands and
      # never written to .git/config: RELEASE_TOKEN if the account or the repository has
      # it, else the job token (see the top of this file). One atomic push per attempt,
      # the branch before the tag.
      - name: Tag and push
        env:
          MODE: ${{ inputs.mode }}
          BASE: ${{ needs.fix.outputs.base }}
          NEXT: ${{ needs.fix.outputs.next }}
          BRANCH: ${{ github.ref_name }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          JOB_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -eu
          if [ -n "$RELEASE_TOKEN" ]; then
            token="$RELEASE_TOKEN"
            pusher="the account of RELEASE_TOKEN"
          else
            token="$JOB_TOKEN"
            pusher="the job token"
          fi
          unset RELEASE_TOKEN JOB_TOKEN
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$token" | base64 -w0)"
          # No hook runs while the token is in the environment.
          git_auth() { git -c core.hooksPath=/dev/null -c "http.extraheader=${auth}" "$@"; }
          refused() {
            echo "Gitea refused the push of ${NEXT} by ${pusher}: nothing was pushed." >&2
            echo "A protected tag (v*) only takes pushes from accounts on its allow-list; the job token can never be on it." >&2
            echo "Set the account secret RELEASE_TOKEN to a token of Patchboard's bot, on that list (Patchboard docs, Part 5), then run this again." >&2
            exit 1
          }
          if [ "$MODE" = audit-fix ]; then
            message="Security fix on ${BASE}: npm audit fix"
          else
            message="Rebuild of ${BASE} with fresh base images"
          fi
          git -c core.hooksPath=/dev/null -c user.name=Patchboard -c user.email=patchboard@noreply.invalid \
            tag -a "$NEXT" -m "$message"

          if [ "$MODE" = audit-fix ]; then
            # Fast-forward the branch only if it has nothing unreleased on top of the base.
            git_auth fetch --quiet origin "$BRANCH"
            if [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse "refs/tags/${BASE}^{commit}")" ] \
               && git_auth push --atomic origin "HEAD:refs/heads/${BRANCH}" "refs/tags/${NEXT}"; then
              echo "${BRANCH} now has the fix."
            else
              git_auth push --atomic origin "HEAD:refs/heads/security-fix/${NEXT}" "refs/tags/${NEXT}" || refused
              echo "::warning::${BRANCH} has commits that are not released yet, or refused ${pusher}. The fix is on security-fix/${NEXT} - merge it into ${BRANCH}."
            fi
            if [ "$pusher" = "the job token" ]; then
              echo "::warning::Pushed with the job token: no CI run checks the fix commit, and a deploy.yml that waits for CI refuses ${NEXT}. Set RELEASE_TOKEN."
            fi
          else
            git_auth push origin "refs/tags/${NEXT}" || refused
          fi
          echo "Tagged ${NEXT}: ${message}"
