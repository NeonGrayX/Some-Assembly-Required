# Tag-triggered deploy to the VPS.
#
#   ./deploy.sh      (or: git tag -a v1.0.0 -m "..." && git push origin v1.0.0)
#
# Builds the Docker image on the runner, pushes it to this Gitea instance's
# container registry and records the digest the registry took, then asks the VPS
# over SSH for `release <tag> <digest>`. The deploy key can do nothing else: its
# forced command (deploy/some-assembly-required-deploy) runs the
# remote-release.sh installed on the VPS, which pulls exactly that digest and
# swaps the container. compose.yaml and remote-release.sh are installed on the
# VPS by hand, never uploaded by a deploy.
name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Records how much memory this job's processes use, for sizing the runner;
      # "Peak memory" at the end reports it.
      - name: Sample memory
        run: |
          ( max=0; while sleep 1; do
              a=$(sed -n 's/^anon //p' /sys/fs/cgroup/memory.stat 2>/dev/null)
              if [ "${a:-0}" -gt "$max" ]; then max=$a; echo "$max" > /tmp/mem-anon-peak; fi
            done ) >/dev/null 2>&1 &

      # A dispatch can name any ref, also a branch called like a release. Only a
      # tag deploys, and the forced command on the VPS
      # (deploy/some-assembly-required-deploy) releases nothing but a v* tag.
      - name: Refuse anything but a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *)
              echo "deploy.yml deploys release tags (refs/tags/v*) only, not '${REF}'." >&2
              exit 1
              ;;
          esac

      - name: Check out the tag
        uses: actions/checkout@v4

      # <registry>/<owner>/<repo>. Lowercased here because the registry rejects
      # uppercase, so a mixed-case owner like NeonGrayX needs nothing special.
      - name: Work out the image name
        env:
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_OVERRIDE: ${{ vars.REGISTRY }}
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eqx '[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}'; then
            echo "Tag '${TAG}' is not usable as an image tag: letters, digits, _ . - only." >&2
            exit 1
          fi
          registry="${REGISTRY_OVERRIDE:-${SERVER_URL#*://}}"
          registry="${registry%%/*}"
          image="$(printf '%s/%s' "$registry" "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "Image: ${image}:${TAG}"

      - name: Make sure Docker is reachable
        run: |
          set -eu
          if ! command -v docker >/dev/null; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends docker-cli \
              || $SUDO apt-get install -y --no-install-recommends docker.io
          fi
          if ! docker version; then
            echo "The job cannot reach a Docker daemon. See Part 3 of the playbook." >&2
            exit 1
          fi

      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -z "${REGISTRY_USER:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "REGISTRY_USER and REGISTRY_TOKEN must both be set." >&2
            exit 1
          fi
          printf '%s' "$REGISTRY_TOKEN" \
            | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin

      - name: Build the image
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          docker build --pull \
            --build-arg VERSION="$TAG" \
            --build-arg COMMIT="$SHA" \
            --label org.opencontainers.image.source="${SERVER_URL}/${REPOSITORY}" \
            --label org.opencontainers.image.version="$TAG" \
            --label org.opencontainers.image.revision="$SHA" \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            .

      # Not `docker push`: it sends each layer in one request, and Cloudflare in
      # front of the registry rejects request bodies over 100 MB. regctl uploads
      # a layer over 50 MB in 50 MB chunks (the registry protocol's chunked
      # upload), which Gitea reassembles; smaller layers go up in one request, as
      # with docker push. Pulls are not limited.
      #
      # `docker save` on the runner gives uncompressed layers, and regctl uploads
      # what it is given. So the image goes into a local OCI directory first and
      # `image mod` gzips the layers on the way to the registry, as `docker push`
      # would. The compression is deterministic: an unchanged layer keeps its
      # digest and is not uploaded again.
      #
      # The digest the registry stored for the tag is recorded: the VPS
      # pulls exactly this image, whatever the tag points at by then.
      - name: Push the image (chunked)
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGCTL_VERSION: v0.11.6
          REGCTL_SHA256: 8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd
        run: |
          set -eu
          tmp="${RUNNER_TEMP:-/tmp}/regctl"
          mkdir -p "$tmp"
          command -v curl >/dev/null || { SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo; $SUDO apt-get update -qq && $SUDO apt-get install -y -qq curl; }
          url="https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
          if ! curl -fsSL --retry 3 -o "$tmp/regctl" "$url"; then
            echo "Could not download regctl ${REGCTL_VERSION} from GitHub (${url}). Nothing was pushed; run the workflow again once GitHub is reachable." >&2
            exit 1
          fi
          if ! echo "${REGCTL_SHA256}  $tmp/regctl" | sha256sum -c --quiet -; then
            echo "The downloaded regctl does not match REGCTL_SHA256. Nothing was pushed. If REGCTL_VERSION was changed, update REGCTL_SHA256 to match." >&2
            exit 1
          fi
          chmod +x "$tmp/regctl"
          export HOME="$tmp"   # keeps regctl's login out of the runner's home
          printf '%s' "$REGISTRY_TOKEN" | "$tmp/regctl" registry login "$REGISTRY" -u "$REGISTRY_USER" --pass-stdin
          "$tmp/regctl" registry set "$REGISTRY" --blob-max 52428800 --blob-chunk 52428800
          docker save "${IMAGE}:${TAG}" -o "$tmp/image.tar"
          "$tmp/regctl" image import "ocidir://$tmp/oci:${TAG}" "$tmp/image.tar"
          rm -f "$tmp/image.tar"
          "$tmp/regctl" image mod "ocidir://$tmp/oci:${TAG}" --layer-compress gzip --create "${IMAGE}:${TAG}"
          digest="$("$tmp/regctl" image digest "${IMAGE}:${TAG}")"
          if ! printf '%s' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "No registry digest for ${IMAGE}:${TAG} (got '${digest}')." >&2
            exit 1
          fi
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "Digest: ${digest}"
          "$tmp/regctl" image copy "${IMAGE}:${TAG}" "${IMAGE}:latest"
          rm -rf "$tmp/oci"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          if [ -z "${SSH_KEY:-}" ] || [ -z "${KNOWN_HOSTS:-}" ]; then
            echo "DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must both be set." >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP:-/tmp}/ssh"
          chmod 700 "${RUNNER_TEMP:-/tmp}/ssh"
          printf '%s\n' "$SSH_KEY" > "${RUNNER_TEMP:-/tmp}/ssh/id"
          chmod 600 "${RUNNER_TEMP:-/tmp}/ssh/id"
          printf '%s\n' "$KNOWN_HOSTS" > "${RUNNER_TEMP:-/tmp}/ssh/known_hosts"

      # One connection, and the only command the key may run: release the tag at
      # the digest just pushed. Nothing is uploaded: the image name, the path,
      # compose.yaml and remote-release.sh are the VPS's own
      # (deploy/some-assembly-required-deploy, installed by hand with them). If
      # the pull fails, the running container keeps serving. If the new
      # container never becomes healthy, the script restores the previous tag.
      - name: Roll out on the VPS
        env:
          TAG: ${{ github.ref_name }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu
          SSH_DIR="${RUNNER_TEMP:-/tmp}/ssh"
          PORT="${DEPLOY_PORT:-22}"
          ssh -n -p "${PORT}" -i "${SSH_DIR}/id" \
            -o UserKnownHostsFile="${SSH_DIR}/known_hosts" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "release ${TAG} ${DIGEST}"

      - name: Clean up credentials
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP:-/tmp}/ssh" "${RUNNER_TEMP:-/tmp}/regctl"
          if [ -n "${REGISTRY:-}" ]; then docker logout "$REGISTRY" >/dev/null 2>&1 || true; fi

      # Only this job's container: a service (Postgres) and anything `docker build`
      # runs are in containers of their own and not counted.
      - name: Peak memory
        if: always()
        run: |
          cg=/sys/fs/cgroup
          if [ -r "$cg/memory.peak" ]; then
            echo "Peak memory, page cache included: $(( $(cat "$cg/memory.peak") / 1048576 )) MiB"
          fi
          if [ -r /tmp/mem-anon-peak ]; then
            echo "Peak memory, processes only (sampled each second): $(( $(cat /tmp/mem-anon-peak) / 1048576 )) MiB"
          fi
          if [ ! -r "$cg/memory.peak" ] && [ ! -r /tmp/mem-anon-peak ]; then
            echo "No cgroup v2 memory figures in this container (needs cgroup v2, Linux 5.19+)."
          fi
