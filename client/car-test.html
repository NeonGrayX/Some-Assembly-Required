<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Car test map · Some Assembly Required</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        touch-action: none;
      }
      #car-panel {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: 300px;
        padding: 10px 12px;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #2b2116;
        background: rgba(255, 248, 232, 0.88);
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      }
      #car-panel h1 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      #car-panel p {
        margin: 0 0 8px;
      }
      #car-panel .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #car-panel a {
        color: inherit;
      }
      #car-panel .touch-keys {
        display: none;
      }
      @media (pointer: coarse) {
        #car-panel .keys {
          display: none;
        }
        #car-panel .touch-keys {
          display: inline;
        }
      }
      #car-panel button[aria-pressed='true'] {
        font-weight: 600;
        outline: 2px solid #2c6670;
      }
      /* The frame rate, bottom left: a dark tab over the pale floor; its graph opens over it. */
      body #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 2;
        padding: 5px 9px;
        border: 0;
        border-radius: 6px;
        background: rgba(27, 29, 35, 0.84);
        color: #fdfbf4;
        font:
          12px ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        text-decoration: none;
        text-shadow: none;
        opacity: 1;
        cursor: pointer;
      }
      body #status:hover {
        background: rgba(27, 29, 35, 0.95);
      }
      body #perf {
        position: fixed;
        left: 12px;
        bottom: 44px;
      }
      #jump {
        position: fixed;
        right: 24px;
        bottom: 32px;
        width: 72px;
        height: 72px;
        border: 0;
        border-radius: 50%;
        background: rgba(44, 102, 112, 0.85);
        color: #fdfbf4;
        font:
          600 14px system-ui,
          sans-serif;
        display: none;
      }
      @media (pointer: coarse) {
        body[data-view='walk'] #jump {
          display: block;
        }
      }
      body.shot #car-panel,
      body.shot #status,
      body.shot #perf,
      body.shot #jump {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <aside id="car-panel">
      <h1>Car test map</h1>
      <p>
        A render test with no game on it.
        <span class="keys"
          >WASD to walk, Shift to run, Space to jump, drag to look, wheel to zoom. F for the free
          view, where the arrow keys move the camera.</span
        >
        <span class="touch-keys">Drag on the left to walk, on the right to look.</span>
      </p>
      <div class="row">
        <button id="walk-view" type="button">Walk</button>
        <button id="free-view" type="button">Free view</button>
        <label
          >Graphics
          <select id="preset"></select
        ></label>
        <a href="./">Main menu</a>
      </div>
    </aside>
    <button id="status" type="button"></button>
    <button id="jump" type="button">Jump</button>
    <script type="module" src="/src/carTest.ts"></script>
  </body>
</html>
