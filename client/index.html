<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Some Assembly Required</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="hint"></div>
      <div id="status"></div>
      <div id="help">
        <h2>Some Assembly Required <small>brick sandbox</small></h2>
        <table>
          <tr>
            <td>WASD / Space / Shift</td>
            <td>move, jump, sprint</td>
          </tr>
          <tr>
            <td>Left click or E</td>
            <td>grab a brick or build, take from a bin, place held brick</td>
          </tr>
          <tr>
            <td>Right click</td>
            <td>pull a single brick off a build</td>
          </tr>
          <tr>
            <td>R</td>
            <td>rotate held brick</td>
          </tr>
          <tr>
            <td>G / T</td>
            <td>drop / throw</td>
          </tr>
          <tr>
            <td>V</td>
            <td>first / third person</td>
          </tr>
          <tr>
            <td>H</td>
            <td>show / hide this help</td>
          </tr>
        </table>
        <p id="click-to-play">Click to play</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
