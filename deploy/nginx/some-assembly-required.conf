# /etc/nginx/sites-available/some-assembly-required  (symlink into sites-enabled)
#
# TLS is terminated by the Cloudflare proxy, so this only ever sees Cloudflare's
# requests. Everything goes to the container on loopback (deploy/compose.yaml).

server {
    listen 80;
    listen [::]:80;

    # Cloudflare's SSL mode is Full: the edge reaches the origin over HTTPS, so
    # without these a plain :80 server would never be used and nginx would fall
    # through to the default_server. Shared origin certificate, same as the
    # other sites on this VPS.
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/nginx/ssl/certs/my.crt;
    ssl_certificate_key /etc/nginx/ssl/private/my.key;

    server_name sar.arrow-lab.de;

    # Visitors on http:// go to https://. Cloudflare reaches this server over
    # HTTPS whichever scheme the visitor used, so $scheme says "https" for both
    # and a redirect keyed on it would never fire. X-Forwarded-Proto is no help
    # either: Cloudflare sets it to the protocol it used to get here, not the one
    # the visitor used. CF-Visitor is the one header that carries the visitor's
    # own scheme. A request arriving without it did not come through Cloudflare
    # and is left alone.
    if ($http_cf_visitor ~ '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 1m;

    # The container does not compress; nginx does it here.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/wasm;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # --- the game's WebSocket ----------------------------------------------
    # Held open for the whole match; it must not be buffered. The server sends
    # room state many times a second, so 300s of silence means it is gone.
    location ~ ^/ws(/|$) {
        proxy_pass http://127.0.0.1:4290;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- the app -----------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:4290;
    }

    # The landing page (arrow-lab.de) fetches this file from the browser to show
    # the app's status. That is a cross-origin request: without this header the
    # browser blocks it and the app reads "no answer" even when it is up. The
    # container does not send the header itself, so this is the one place it is set.
    location = /build-info.json {
        proxy_pass http://127.0.0.1:4290;
        add_header Access-Control-Allow-Origin "*" always;
    }

    access_log /var/log/nginx/some-assembly-required.access.log;
    error_log  /var/log/nginx/some-assembly-required.error.log;
}
