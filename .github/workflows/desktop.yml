name: Desktop app

# Builds the desktop app (desktop/): the Windows installer and a Linux AppImage, and checks
# each one starts, loads the game in its window and lets a player join. CI and Release both
# run it; Release then publishes what it built.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            exe: desktop/release/win-unpacked/Some Assembly Required.exe
            run: node
            files: desktop/release/*.exe
          - os: ubuntu-latest
            target: --linux
            exe: desktop/release/linux-unpacked/some-assembly-required
            run: xvfb-run -a node
            files: desktop/release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      # A release is numbered after its tag; other builds keep the version in package.json.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
        env:
          SAR_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - run: npm run dist -- ${{ matrix.target }}
        working-directory: desktop
      - run: ${{ matrix.run }} desktop/scripts/smoke.mjs "${{ matrix.exe }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
