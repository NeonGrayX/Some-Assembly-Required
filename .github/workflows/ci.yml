name: CI

on:
  push:
  pull_request:

# Checks only read the repository; nothing here needs to write to it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The bots' walking map in WebAssembly is built from shared/assembly and checked in.
      - run: npm run build:wasm -w @sar/shared && git diff --exit-code shared/src/bots/navcore.wasm.ts
      - run: npm test
      - run: npm run build

  host:
    # The host executable and the Docker image start, serve the game and let a player join.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run build:host
      - run: npm run smoke -w @sar/server -- ../release/some-assembly-required-host-linux-x64
      - run: npm run smoke -w @sar/server -- ../release/some-assembly-required-host-linux-x64 --https
      - run: docker build -t some-assembly-required .
      - run: docker run -d --name game -p 7777:8080 some-assembly-required
      - run: npm run smoke -w @sar/server -- http://localhost:7777

  desktop:
    uses: ./.github/workflows/desktop.yml
