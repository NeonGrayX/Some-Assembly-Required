name: Release

# Builds the host executables for every platform. Pushing a tag like v0.5.0 also publishes
# them as a GitHub Release; running it by hand only keeps them as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # macOS executables are built on macOS so they come out signed (ad hoc), which Apple
          # silicon requires to run them at all.
          - os: ubuntu-latest
            targets: linux-x64,linux-arm64
            smoke: some-assembly-required-host-linux-x64
          - os: windows-latest
            targets: windows-x64
            smoke: some-assembly-required-host-windows-x64.exe
          - os: macos-latest
            targets: macos-arm64,macos-x64
            smoke: some-assembly-required-host-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run build
      - run: npm run build:host -w @sar/server -- --target ${{ matrix.targets }}
      - run: npm run smoke -w @sar/server -- ../release/${{ matrix.smoke }} --https
      - name: Package
        shell: bash
        run: |
          cd release
          for f in some-assembly-required-host-*; do
            case "$f" in
              *.exe) ;;
              *macos*) zip -q "$f.zip" "$f" && rm "$f" ;;
              *) tar -czf "$f.tar.gz" "$f" && rm "$f" ;;
            esac
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.os }}
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
